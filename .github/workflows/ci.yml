name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Wait for Mongo
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 27017 && echo "Mongo is up" && exit 0
            echo "Waiting Mongo... ($i)"
            sleep 2
          done
          echo "Mongo not available"; exit 1

      - name: Build
        run: npm run build

      - name: Test
        env:
          MONGO_URI: mongodb://localhost:27017/kunna_test
          KUNNA_URL: https://openapi.kunna.es/data/dummy-token
          TIME_START: 2025-01-17T05:18:38Z
          TIME_END: 2025-01-19T05:18:38Z
        run: npm test
